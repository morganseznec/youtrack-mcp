[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youtrack-mcp"
version = "0.1.0"
description = "Model Context Protocol server for YouTrack — create, comment, search, and close issues from Claude Code and other MCP clients."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Morgan Seznec" },
]
keywords = ["mcp", "youtrack", "claude", "claude-code", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "mcp[cli]>=1.2.0",
    "pyyaml>=6.0",
]

[project.scripts]
youtrack-mcp = "youtrack_mcp.server:main"

[project.urls]
Homepage = "https://github.com/morganseznec/youtrack-mcp"
Repository = "https://github.com/morganseznec/youtrack-mcp"
Issues = "https://github.com/morganseznec/youtrack-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/youtrack_mcp"]
